name = "panther"
account_id = "2b78d2d436beef8cb4a0c47c53a85632"
compatibility_date = "2025-07-10"
compatibility_flags = ["nodejs_compat"]

# ── Environment Variables ─────────────────────────────────────
# Set secrets (API keys, tokens) in Cloudflare Dashboard →
# Pages → panther → Settings → Environment variables.
# DO NOT put secrets in wrangler.toml.
[vars]
ENVIRONMENT = "production"

# Crawl4AI
CRAWL4AI_API_URL = "https://crawl4ai-production-e503.up.railway.app"
# CRAWL4AI_API_KEY — set as a Cloudflare Pages dashboard secret

# Database — Cloudflare Hyperdrive only (no direct Postgres, per Constitution).
# The [[hyperdrive]] binding is NOT committed here: it is injected at deploy
# time by scripts/setup-hyperdrive.mjs (creates the instance + writes its id).
# Why: a binding in this file forces astro dev's miniflare to emulate a local
# Hyperdrive, which cannot reach Neon from the dev sandbox. Deploy paths:
#   npm run deploy   → runs setup-hyperdrive.mjs then builds & deploys
#   npx wrangler deploy   → run `npm run hyperdrive:setup` first
#
# Auth
BETTER_AUTH_URL = "https://panther.ng"

# Cloudflare Images
CF_IMAGES_ACCOUNT = ""
CF_IMAGES_API_TOKEN = ""

# R2 (S3-compatible credentials for presigned upload URLs)
R2_ACCOUNT_ID = ""
R2_ACCESS_KEY_ID = ""
R2_SECRET_ACCESS_KEY = ""
R2_BUCKET_NAME = "panther-videos"
R2_PUBLIC_URL = ""

# ── R2 Bucket Bindings ────────────────────────────────────────
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "panther-images"

[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "panther-videos"

# ── Nightly pipeline (cron + queues) ──────────────────────────
# Lives in the separate pipeline Worker — see wrangler.workers.toml.
# Deploy it with:  npx wrangler deploy -c wrangler.workers.toml
